<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Форма замовлення</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f3f6f4;--card:#fff;--ink:#17261f;--muted:#5f6f67;--line:#d3ddd7;--accent:#1f6b4f;--accent-ink:#fff;--err:#b3261e;--ok:#1f7a45;--ok-bg:#e6f4ec;--err-bg:#fdecea}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101814;--card:#18241e;--ink:#e8f0eb;--muted:#9bb0a5;--line:#2c3d34;--accent:#4fb88b;--accent-ink:#06130d;--err:#ff8a80;--ok:#7ddba5;--ok-bg:#16301f;--err-bg:#3a1a18}}
:root[data-theme="dark"]{--bg:#101814;--card:#18241e;--ink:#e8f0eb;--muted:#9bb0a5;--line:#2c3d34;--accent:#4fb88b;--accent-ink:#06130d;--err:#ff8a80;--ok:#7ddba5;--ok-bg:#16301f;--err-bg:#3a1a18}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5}
main{max-width:560px;margin:0 auto;padding:24px 16px 40px}
h1{font-size:1.6rem;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 20px}
fieldset{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:16px;margin:0 0 16px}
legend{font-weight:700;padding:0 6px}
.item{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.item:last-of-type{border-bottom:0}
.item input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent)}
.name{font-weight:600}
.price{color:var(--muted);font-size:.9rem}
.qty{display:flex;align-items:center;gap:6px;visibility:hidden}
.item.on .qty{visibility:visible}
.qty button{width:32px;height:32px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;font-size:1.1rem;cursor:pointer}
.qty input{width:48px;height:32px;text-align:center;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
label.f{display:block;margin-bottom:12px;font-weight:600;font-size:.92rem}
label.f input,label.f textarea{display:block;width:100%;margin-top:4px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
label.f textarea{min-height:90px;resize:vertical}
input:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bad{border-color:var(--err)!important}
.err{color:var(--err);font-size:.88rem;min-height:1.2em;margin:4px 0 0}
.total{display:flex;justify-content:space-between;font-size:1.15rem;font-weight:700;padding:4px 0 14px}
.send{width:100%;padding:13px;border:0;border-radius:10px;background:var(--accent);color:var(--accent-ink);font:inherit;font-weight:700;cursor:pointer}
.send:disabled{opacity:.7;cursor:default}
.msg{margin-top:16px;padding:14px 16px;border-radius:10px;font-weight:600;border:1px solid}
.msg.success{color:var(--ok);background:var(--ok-bg);border-color:var(--ok)}
.msg.error{color:var(--err);background:var(--err-bg);border-color:var(--err)}
[hidden]{display:none}
</style>
</head>
<body>
<main>
<h1>Замовлення товару</h1>
<p class="sub">Оберіть позиції, вкажіть кількість і залиште контакти.</p>

<form id="f" novalidate>
<fieldset>
<legend>Позиції</legend>
<div id="items"></div>
<p class="err" id="itemsErr" role="alert"></p>
</fieldset>

<fieldset>
<legend>Контактні дані</legend>
<label class="f">Ім'я *<input id="fn" name="name" autocomplete="given-name" required></label>
<label class="f">Email *<input id="em" name="email" type="email" autocomplete="email" placeholder="name@example.com" required></label>
<label class="f">Телефон<input id="ph" name="phone" type="tel" autocomplete="tel" placeholder="+380 50 123 45 67"></label>
<label class="f">Коментар<textarea id="cm" name="comment"></textarea></label>
<p class="err" id="contactErr" role="alert"></p>
</fieldset>

<div class="total"><span>Разом</span><span id="total">0 грн</span></div>
<button type="submit" class="send" id="sendBtn">Замовити</button>
<div id="status" role="status" aria-live="polite" hidden></div>
</form>
</main>

<script>
const WEBHOOK_URL = "https://hook.eu1.make.com/huupsts7qvbows2y9wiqp7fsfmqyqyry";

const products = [
  { sku: "P1", name: "Групове заняття", price: 300 },
  { sku: "P2", name: "Індивідуальне заняття", price: 800 },
  { sku: "P3", name: "Абонемент на місяць", price: 2500 }
];

const form = document.getElementById("f");
const box = document.getElementById("items");
const statusEl = document.getElementById("status");
const sendBtn = document.getElementById("sendBtn");
const state = products.map(() => ({ on: false, q: 1 }));
const rowEls = [];

products.forEach((pr, i) => {
  const row = document.createElement("div");
  row.className = "item";
  row.innerHTML =
    '<input type="checkbox" id="c' + i + '" aria-label="' + pr.name + '">' +
    '<label for="c' + i + '"><span class="name">' + pr.name + '</span><br><span class="price">' + pr.price + ' грн</span></label>' +
    '<div class="qty"><button type="button" aria-label="Менше">−</button>' +
    '<input type="number" min="1" max="99" value="1" aria-label="Кількість">' +
    '<button type="button" aria-label="Більше">+</button></div>';
  const cb = row.querySelector("input[type=checkbox]");
  const num = row.querySelector("input[type=number]");
  const btns = row.querySelectorAll("button");
  const sync = () => {
    state[i].q = Math.max(1, Math.min(99, parseInt(num.value, 10) || 1));
    num.value = state[i].q;
    row.classList.toggle("on", state[i].on);
    calc();
  };
  cb.addEventListener("change", () => {
    state[i].on = cb.checked;
    if (cb.checked) num.value = 1;
    sync();
  });
  btns[0].addEventListener("click", () => { num.value = (parseInt(num.value, 10) || 1) - 1; sync(); });
  btns[1].addEventListener("click", () => { num.value = (parseInt(num.value, 10) || 0) + 1; sync(); });
  num.addEventListener("change", sync);
  rowEls.push({ row, cb, num, sync });
  box.appendChild(row);
});

function calc() {
  const t = state.reduce((s, x, i) => s + (x.on ? x.q * products[i].price : 0), 0);
  document.getElementById("total").textContent = t + " грн";
  if (state.some(x => x.on)) document.getElementById("itemsErr").textContent = "";
  return t;
}

function showStatus(type, text) {
  statusEl.className = "msg " + type;
  statusEl.textContent = text;
  statusEl.hidden = false;
}

form.addEventListener("reset", () => {
  setTimeout(() => {
    state.forEach(x => { x.on = false; x.q = 1; });
    rowEls.forEach(r => { r.num.value = 1; r.row.classList.remove("on"); });
    calc();
  }, 0);
});

form.addEventListener("submit", async (event) => {
  event.preventDefault();
  statusEl.hidden = true;

  const fn = document.getElementById("fn");
  const em = document.getElementById("em");
  const ph = document.getElementById("ph");
  const cm = document.getElementById("cm");

  const items = [];
  state.forEach((x, i) => {
    if (x.on) {
      items.push({
        sku: products[i].sku,
        name: products[i].name,
        qty: Number(x.q),
        price: Number(products[i].price),
        subtotal: Number(x.q * products[i].price)
      });
    }
  });

  if (!items.length) {
    document.getElementById("itemsErr").textContent = "Оберіть хоча б одну позицію";
    return;
  }
  document.getElementById("itemsErr").textContent = "";

  [fn, em, ph].forEach(el => el.classList.remove("bad"));
  const bad = [];
  if (!fn.value.trim()) bad.push(fn);
  if (!em.value.trim() || !em.checkValidity()) bad.push(em);
  const digits = ph.value.replace(/\D/g, "");
  if (ph.value.trim() && (digits.length < 10 || digits.length > 13)) bad.push(ph);
  bad.forEach(el => el.classList.add("bad"));
  document.getElementById("contactErr").textContent = bad.length
    ? "Перевірте поля: ім'я та email обов'язкові; телефон — 10–12 цифр, якщо вказуєте."
    : "";
  if (bad.length) return;

  let phone = "";
  if (digits) {
    phone = "+" + digits;
    if (digits.length === 10 && digits[0] === "0") phone = "+38" + digits;
  }

  const total = items.reduce((s, it) => s + it.subtotal, 0);
  const email = em.value.trim();
  const order = {
    order_id: "ORD-" + String(Date.now()).slice(-6),
    created_at: new Date().toISOString(),
    customer: {
      name: fn.value.trim(),
      email: email,
      phone: phone
    },
    comment: cm.value.trim(),
    items: items,
    items_count: items.length,
    total: total,
    currency: "UAH"
  };

  sendBtn.disabled = true;
  sendBtn.textContent = "Надсилаємо…";

  try {
    const res = await fetch(WEBHOOK_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(order)
    });
    if (!res.ok) throw new Error("Сервер відповів зі статусом " + res.status);
    showStatus("success", "Дякуємо! Підтвердження надіслано на " + email);
    form.reset();
  } catch (err) {
    console.error(err);
    showStatus("error", "Не вдалося надіслати замовлення: " + (err && err.message ? err.message : "невідома помилка"));
  } finally {
    sendBtn.disabled = false;
    sendBtn.textContent = "Замовити";
  }
});
</script>
</body>
</html>
